<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Utilidades Públicas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="area">

        </div>

            <option value="pm">Polícia Militar</option>
            <option value="bombeiros">Bombeiros</option>
            <option value="samu">SAMU</option>
            <option value="df">Defesa Civil</option>
            <option value="pc">Polícia Civil</option>
            <option value="deat">Delegacia do Turista</option>
            <option value="disqued">Disque Denúncia</option>
            <option value="cdaam">Central de Atendimento a mulher</option>
            <option value="dh">Direitos Humanos</option>
            <option value="procon">Procon</option>
            <option value="hemorio">HemoRio</option>
            <option value="detran">Detran</option>
            <option value="dambiente">Disque Ambiente</option>
        </select>

        <button onclick="consultar()">📞Consultar</button>
        
    <footer>
        <p>&copy; 2023 Utilidades Públicas. Todos os direitos reservados.</p>
    </footer>
    </div>
    <div class="resultado" id="resultado">
        <h2 id="nomeDepartamento"></h2>
        <p>Telefone</p>
        <strong id="telefone"></strong>
    </div>
    </div>

</html>
